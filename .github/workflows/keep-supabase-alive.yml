name: Keep Supabase alive

on:
  schedule:
    - cron: '0 6 */3 * *'   # tous les 3 jours à 06:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appel de l'API REST Supabase
        run: |
          KEY="sb_publishable_J3dINWjQMus8IJPHGGsChA_K6-N5OKy"
          BASE="https://luzualkgsmnacisshbzw.supabase.co/rest/v1/"
          # Racine de l'API REST (peut répondre 401/403 selon la configuration : non bloquant)
          curl --silent --max-time 30 -H "apikey: $KEY" "$BASE" -o /dev/null -w "REST racine : HTTP %{http_code}\n" || true
          # Requête réelle sur la base (garantit une activité) : doit réussir
          curl --fail --silent --show-error --max-time 30 -X POST \
            -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d '{"p_etablissement":"lfp-pekin"}' \
            "${BASE}rpc/lister_profils_publics" -o /dev/null -w "RPC : HTTP %{http_code}\n"
